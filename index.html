<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WIINAMP</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell playlist-hidden"><header class="app-titlebar" id="appTitlebar"><span>⚡ WIINAMP</span><div class="window-actions"><button data-host-action="minimize" aria-label="Minimize"><span class="minimize-glyph">−</span></button><button class="maximize-disabled" disabled title="Maximize is unavailable for this app" aria-label="Maximize">□</button><button data-host-action="close" aria-label="Close">×</button></div></header>
<section class="player"><div class="display"><div class="lcd-title" id="trackTitle">APPLE MUSIC / SYSTEM MIX</div><div class="lcd-meta" id="trackInfo">PRESS SYSTEM MIX TO START</div><div class="visualizer" id="visualizer"></div><div class="time-row"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="controls"><button id="previous">|◀</button><button id="play">▶</button><button id="pause">Ⅱ</button><button id="stop">■</button><button id="next">▶|</button><label>VOL <input id="volume" type="range" min="0" max="100" value="72"></label></div><div class="option-row"><button id="shuffle">SHUFFLE</button><button id="repeat">REPEAT</button><button id="systemAudio">SYSTEM MIX</button><button id="settings" class="gear">⚙</button><button id="openFiles" class="add">+ ADD MEDIA</button><input id="fileInput" type="file" accept="audio/*" multiple hidden></div></section>
<section class="playlist collapsed" id="playlist"><header><span>PLAYLIST EDITOR</span><span id="count">0 TRACKS</span><button id="togglePlaylist">+</button></header><div class="playlist-head"><span>#</span><span>TITLE</span><span>LENGTH</span></div><ol id="playlistItems"><li class="empty">Drag and drop music files here, or use ADD MEDIA.</li></ol><footer><button id="clear">CLEAR</button><span id="status">READY</span></footer></section>
<section class="settings-panel" id="settingsPanel" hidden><div class="settings-dialog"><header><span>⚙ SETTINGS</span><button id="closeSettings">×</button></header><label>Always on top <input id="alwaysOnTop" type="checkbox"></label><label>Visualizer sensitivity <input id="sensitivity" type="range" min="50" max="250" value="100"><output id="sensitivityValue">100%</output></label><label>Design <select id="theme"><option value="luna">Luna Blue</option><option value="olive">Olive Green</option><option value="silver">Silver</option></select></label></div></section>
</main><audio id="audio"></audio><script src="app.js"></script></body></html>
